<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kairos</title>
    <link rel="stylesheet" href="panel.css" />
    <script>
      (function () {
        var query = window.matchMedia("(prefers-reduced-motion: reduce)");
        function apply() {
          if (query.matches) document.documentElement.setAttribute("data-motion", "reduced");
          else document.documentElement.removeAttribute("data-motion");
        }
        apply();
        query.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <header class="pn-head">
      <span class="pn-wordmark">
        <img class="day" src="brand/kairos-wordmark.svg" alt="kairos" width="2552" height="864">
        <img class="night" src="brand/kairos-wordmark-night.svg" alt="kairos" width="2552" height="864">
      </span>
    </header>
    <main id="panel" aria-live="polite"></main>
    <footer class="pn-footer">
      <span id="pn-status" class="pn-meta-text"></span>
    </footer>
    <script type="module" src="panel.js"></script>
  </body>
</html>
