[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvas-mcp"
version = "1.11.0"
description = "Vendored student-trimmed fork of vishalsachdev/canvas-mcp + Kairos local companion"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Kairos" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
keywords = ["canvas", "lms", "mcp", "student", "education", "api"]
dependencies = [
    "fastmcp>=3.4.7,<4",
    "mcp>=1.26.0,<2",
    "httpx>=0.28.1,<1",
    "python-dotenv>=1.2.4,<2",
    "pydantic>=2.13.1,<3",
    "python-dateutil>=2.9.0,<3",
    "pyyaml>=6.0",
    "anthropic>=0.40.0",
    "defusedxml>=0.7.1,<1",
]


[project.optional-dependencies]
google = [
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.120.0",
]
diagrams = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/jacobdpfeifer-svg/Kairos_Time"
Repository = "https://github.com/jacobdpfeifer-svg/Kairos_Time"

[project.scripts]
canvas-mcp-server = "canvas_mcp.server:main"

[tool.hatch.version]
path = "src/canvas_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"schools" = "canvas_mcp/schools"

[tool.ruff]
target-version = "py310"
line-length = 88
# study_session_reference.py is a dense research fixture, not shipped code.
# Excluded so `ruff check .` matches CI's `ruff check src/ tests/` and the next
# real finding is not buried under 58 known ones.
exclude = ["archive/", "docs/research/fixtures/"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "TID251", # banned APIs (anonymization single-layer invariant, #179)
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# core/ and tests may use the anonymization internals directly; everything else
# must rely on the client-layer gate in core/client.py (#179)
"src/canvas_mcp/core/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"canvas_mcp.core.anonymization.anonymize_response_data".msg = "Anonymization is applied once, at the client layer (core/client.py, gated by ENABLE_DATA_ANONYMIZATION). Do not re-anonymize in tool code — see issue #179."

[tool.black]
target-version = ['py310']
line-length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "numpy", "numpy.*", "mem0", "mem0.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "black>=26.10.0",
    "mypy>=2.4.0,<3",
    # Declared so the workflow-permission policy tests actually run in CI. They
    # use importorskip, so relying on a transitive PyYAML would let the gate
    # skip silently — the exact failure mode it exists to prevent.
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]
