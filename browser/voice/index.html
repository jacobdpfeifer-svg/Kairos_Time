<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice intake</title>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --ink: #1c1c1a;
    --muted: #66665f;
    --line: #dcdcd6;
    --accent: #1f5fbf;
    --accent-ink: #ffffff;
    --live: #1b7f4b;
    --warn: #b3261e;
    --user: #eef3fb;
    --model: #f1f1ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --surface: #1f1f1d;
      --ink: #ecece8;
      --muted: #9a9a92;
      --line: #35352f;
      --accent: #6fa0ef;
      --accent-ink: #10151f;
      --live: #58c58a;
      --warn: #f2867e;
      --user: #1f2a3a;
      --model: #272724;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.25rem; margin: 0; }
  .sub { color: var(--muted); font-size: 0.875rem; margin: 4px 0 0; }
  .pill {
    font-size: 0.8125rem; padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); background: var(--surface);
  }
  .pill[data-state="live"] { color: var(--live); border-color: var(--live); }
  .pill[data-state="error"] { color: var(--warn); border-color: var(--warn); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 12px; align-items: center; }
  select, input[type="text"], button {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
  }
  button { cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; margin-top: 12px;
  }
  .panel h2 { font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 8px; }
  #transcript { min-height: 160px; max-height: 46vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .turn { padding: 8px 12px; border-radius: 10px; max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .turn.user { background: var(--user); align-self: flex-end; }
  .turn.model { background: var(--model); align-self: flex-start; }
  .empty { color: var(--muted); }
  #captured { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  #captured li { font-size: 0.9375rem; }
  #captured .kind { font-weight: 600; margin-right: 6px; }
  #captured li.fail { color: var(--warn); }
  form { display: flex; gap: 8px; margin-top: 12px; }
  form input { flex: 1; min-width: 0; }
  #notice { color: var(--warn); margin: 12px 0 0; min-height: 1.5em; }
  #summary { margin-top: 12px; color: var(--muted); font-size: 0.9375rem; }
  @media (max-width: 480px) { .controls > * { flex: 1 1 auto; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Voice intake</h1>
      <p class="sub">Talk it through. Goals and class notes are written to your inbox as you go. Use headphones.</p>
    </div>
    <span id="status" class="pill" data-state="idle" role="status" aria-live="polite">Idle</span>
  </header>

  <div class="controls">
    <label for="mode" class="sub">Session</label>
    <select id="mode" aria-label="Session type">
      <option value="goals">Goals &amp; priorities</option>
      <option value="checkin">Weekly check-in</option>
      <option value="class">Class reflection</option>
      <option value="onboarding">Design my workspace</option>
    </select>
    <select id="course" aria-label="Course" hidden></select>
    <button id="start" class="primary" type="button">Start</button>
    <button id="mute" type="button" hidden>Mute mic</button>
  </div>

  <p id="notice" role="alert"></p>

  <section class="panel" aria-label="Conversation">
    <h2>Conversation</h2>
    <div id="transcript" aria-live="polite"><span class="empty">Nothing yet. Press Start and say hello.</span></div>
    <form id="typed" hidden>
      <input id="typedText" type="text" autocomplete="off" placeholder="Or type a message" aria-label="Type a message">
      <button type="submit">Send</button>
    </form>
  </section>

  <section class="panel" aria-label="Captured">
    <h2>Captured this session</h2>
    <ul id="captured"><li class="empty">Nothing saved yet.</li></ul>
  </section>

  <p id="summary"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
