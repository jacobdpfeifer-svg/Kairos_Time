name: Canvas MCP Enhancement Testing

on:
  push:
    branches: [ main, development, phase1-productname-pivot ]
  pull_request:
    branches: [ main, phase1-productname-pivot ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Install Ruff
      run: python -m pip install ruff

    - name: Run Ruff
      run: ruff check src/ tests/

    - name: Install mypy
      # Read the constraint from pyproject instead of repeating it. A literal
      # here silently drifts: it said "<2" while pyproject said "<3", so CI
      # would have kept type-checking on mypy 1.x forever while contributors
      # running `uv sync` got 2.x — the gate asserting a version nobody uses.
      run: |
        python -m pip install -e .
        CONSTRAINT=$(python - <<'PY'
        import tomllib
        with open("pyproject.toml", "rb") as fh:
            groups = tomllib.load(fh)["dependency-groups"]["dev"]
        specs = [d for d in groups if isinstance(d, str) and d.startswith("mypy")]
        if len(specs) != 1:
            raise SystemExit(f"expected exactly one mypy spec in dependency-groups.dev, found {specs}")
        # Stub packages (types-PyYAML, ...) too, or mypy fails on import-untyped.
        stubs = [d for d in groups if isinstance(d, str) and d.startswith("types-")]
        print(" ".join([specs[0], *stubs]))
        PY
        )
        echo "Installing $CONSTRAINT"
        python -m pip install $CONSTRAINT

    - name: Run mypy
      run: mypy src/

  # Runs the WHOLE suite on every supported interpreter. pyproject declares
  # requires-python = ">=3.10", so 3.10 is a supported target and must be
  # tested: a 3.10-only break (datetime.UTC is 3.11+, for one) is invisible on
  # a 3.11-only runner.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # Full history: test_acceptance_replay_real_history replays the
        # closing-keyword checker over every real commit message. The default
        # shallow checkout has no `main` and no old commits, so the replay would
        # skip -- and a validator that only ever sees its own fixtures has not
        # earned its place.
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # pyyaml is needed by the workflow-permission policy tests. They use
        # importorskip, so omitting it makes them skip silently in the one job
        # branch protection actually requires — passing green while the check
        # they encode is never run.
        pip install pytest pytest-asyncio pyyaml

    - name: Run the test suite
      run: pytest tests/ -q

  # Aggregator. Branch protection requires a check literally named
  # "test-enhancements", and a matrix job publishes per-version names
  # ("test (3.10)"), which would leave the required check permanently pending
  # and block every PR. This gate keeps the required name while making it mean
  # "the full suite passed on every supported Python".
  test-enhancements:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
    - name: Require every matrix job to have succeeded
      run: |
        echo "matrix result: ${{ needs.test.result }}"
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "::error::Test suite failed on at least one supported Python version."
          exit 1
        fi
        echo "## Canvas MCP test results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Full suite passed on 3.10, 3.11, 3.12 and 3.13." >> $GITHUB_STEP_SUMMARY

  browser-sync:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "20"

    - name: Install browser dependencies
      working-directory: browser
      run: npm ci

    - name: Run browser sync unit tests
      working-directory: browser
      run: npm test

  # The Tauri app has macOS-only dependencies (window-vibrancy, tray/dock
  # integration) and shipped with zero CI coverage: a regression in the Rust
  # commands/daemon/dock code or the React frontend would only surface on
  # someone's own machine. This runs the same local dev-loop checks
  # (packaging-notes.md) on every push, without attempting a signed bundle.
  app-check:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # tauri-build requires every bundle resource path to exist. The bundled
    # runtime (scripts/stage-runtime.sh) is only staged for a real package
    # build, so give the check empty stand-ins.
    - name: Stub bundled runtime resources
      working-directory: app/src-tauri
      run: |
        for d in runtime/browser-node_modules runtime/python runtime/node; do
          mkdir -p "$d" && touch "$d/.ci-placeholder"
        done

    - name: cargo check (Tauri backend)
      working-directory: app/src-tauri
      run: cargo check --locked

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "20"

    - name: Install app dependencies
      working-directory: app
      run: npm ci

    - name: Type-check and build the frontend
      working-directory: app
      run: npm run build
